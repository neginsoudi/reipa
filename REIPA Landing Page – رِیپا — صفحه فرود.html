<body>
  <div id="__bundler_placeholder">Loading رِیپا — دستیار هوش مصنوعی اینستاگرام...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

span style=\"font-size: 12px; padding: 6px 10px; border-radius: 10px; background: rgba(255,255,255,0.06); color: #A1A1AA; white-space: nowrap\">پیش‌نویس<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{tab4}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"panel\" style=\"position: relative; display: flex; flex-direction: column; gap: 22px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\"><span style=\"font-weight: 700; font-size: 16px\">گزارش هفتگی<\u002Fspan><span style=\"font-size: 12px; color: #8B8B95\">داده‌های نمایشی<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 20px; flex-wrap: wrap\">\n<div style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 13px; color: #8B8B95\">گفتگوها<\u002Fspan><span style=\"font-size: 28px; font-weight: 800\">۸٬۴۱۲<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 13px; color: #8B8B95\">نیت خرید<\u002Fspan><span style=\"font-size: 28px; font-weight: 800\">۱٬۹۰۶<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 13px; color: #8B8B95\">سفارش<\u002Fspan><span style=\"font-size: 28px; font-weight: 800\" class=\"gt\">۵۴۷<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: flex-end; gap: 12px; height: 170px; padding-top: 10px; border-bottom: 1px solid rgba(255,255,255,0.08)\">\n<sc-for list=\"{{week}}\" as=\"d\" hint-placeholder-count=\"7\">\n<div style=\"flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end\">\n<div style=\"width: 100%; display: flex; gap: 4px; align-items: flex-end; height: 100%\">\n<div class=\"bar\" style=\"flex: 1; border-radius: 6px 6px 2px 2px; background: rgba(255,255,255,0.12); height: {{d.a}}\"><\u002Fdiv>\n<div class=\"bar gmark\" style=\"flex: 1; border-radius: 6px 6px 2px 2px; height: {{d.b}}\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 12px; margin-top: -12px\">\n<sc-for list=\"{{week}}\" as=\"d\" hint-placeholder-count=\"7\"><span style=\"flex: 1; text-align: center; font-size: 12px; color: #8B8B95\">{{d.l}}<\u002Fspan><\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 18px; font-size: 13px; color: #A1A1AA\"><span style=\"display: inline-flex; gap: 6px; align-items: center\"><span style=\"width: 10px; height: 10px; border-radius: 3px; background: rgba(255,255,255,0.25)\"><\u002Fspan>گفتگو<\u002Fspan><span style=\"display: inline-flex; gap: 6px; align-items: center\"><span class=\"gmark\" style=\"width: 10px; height: 10px; border-radius: 3px\"><\u002Fspan>سفارش<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{tab5}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"panel\" style=\"position: relative; display: flex; flex-direction: column; gap: 14px; font-size: 15px; line-height: 1.8\">\n<div style=\"align-self: flex-start; max-width: 76%; background: #26262C; padding: 10px 14px; border-radius: 20px 20px 6px 20px\">سفارشم آسیب‌دیده رسیده، خیلی ناراحتم.<\u002Fdiv>\n<div class=\"sent\" style=\"align-self: flex-end; max-width: 78%; padding: 10px 14px; border-radius: 20px 20px 20px 6px\">واقعاً متأسفم. همین الان موضوع رو به همکارم می‌سپارم تا شخصاً پیگیری کنه.<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 12px; color: #8B8B95; font-size: 13px\"><span style=\"flex: 1; height: 1px; background: rgba(255,255,255,0.08)\"><\u002Fspan>رِیپا گفتگو را به سارا (پشتیبانی) سپرد<span style=\"flex: 1; height: 1px; background: rgba(255,255,255,0.08)\"><\u002Fspan><\u002Fdiv>\n<div style=\"background: #0D0D11; border: 1px solid rgba(251,191,36,0.3); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; font-size: 14px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\"><span style=\"font-weight: 700\">خ span>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #111116; border: 1px solid rgba(255,255,255,0.08); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-size: 12px; color: #C4B5FD; font-weight: 700\">بینش<\u002Fspan>\n<span style=\"font-size: 15px; font-weight: 700; line-height: 1.8\">۴۲ نفر قیمت «مانتو کتان» را زیر پست پرسیده‌اند.<\u002Fspan>\n<span style=\"font-size: 14px; color: #A1A1AA; line-height: 1.8\">پیشنهاد: قیمت را در کپشن بنویسید و لینک سفارش را در استوری بگذارید.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background: #111116; border: 1px solid rgba(255,255,255,0.08); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"font-size: 12px; color: #C4B5FD; font-weight: 700\">بینش<\u002Fspan>\n<span style=\"font-size: 15px; font-weight: 700; line-height: 1.8\">ریلزهای پشت‌صحنه بیشترین گفتگوی خرید را ساخته‌اند.<\u002Fspan>\n<span style=\"font-size: 14px; color: #A1A1AA; line-height: 1.8\">پیشنهاد: هفته‌ای دو ریلز از فرایند تولید منتشر کنید.<\u002Fspan>\n<\u002Fdiv>\n<div class=\"gborder\" style=\"border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\"><span style=\"font-size: 15px; font-weight: 700\">بهترین زمان انتشار<\u002Fspan><span class=\"en\" style=\"font-size: 15px; font-weight: 700\" dir=\"ltr\">21:00 – 23:00<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 4px; align-items: flex-end; height: 48px\">\n<span style=\"flex: 1; height: 20%; border-radius: 3px; background: rgba(255,255,255,0.1)\"><\u002Fspan><span style=\"flex: 1; height: 30%; border-radius: 3px; background: rgba(255,255,255,0.1)\"><\u002Fspan><span style=\"flex: 1; height: 26%; border-radius: 3px; background: rgba(255,255,255,0.1)\"><\u002Fspan><span style=\"flex: 1; height: 44%; border-radius: 3px; background: rgba(255,255,255,0.1)\"><\u002Fspan><span style=\"fl Fsvg><span style=\"font-size: 22px; font-weight: 800\" class=\"gt\">با رِیپا<\u002Fspan><\u002Fspan><span style=\"font-size: 13px; color: #6EE7B7; display: inline-flex; gap: 8px; align-items: center\"><span class=\"ping\"><\u002Fspan>همه پاسخ داده شد<\u002Fspan><\u002Fdiv>\n<div style=\"position: relative; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"display: flex; justify-content: space-between; padding: 12px 14px; border-radius: 14px; background: rgba(52,211,153,0.07); border: 1px solid rgba(52,211,153,0.22); font-size: 14px\"><span>«قیمت؟» · قیمت و سایزها در دایرکت ارسال شد<\u002Fspan><span style=\"font-size: 12px; color: #6EE7B7\">چند ثانیه بعد<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; padding: 12px 14px; border-radius: 14px; background: rgba(52,211,153,0.07); border: 1px solid rgba(52,211,153,0.22); font-size: 14px\"><span>«موجوده؟» · سفارش ۱۰۵۱ ثبت شد<\u002Fspan><span style=\"font-size: 12px; color: #6EE7B7\">پرداخت‌شده<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; padding: 12px 14px; border-radius: 14px; background: rgba(251,191,36,0.07); border: 1px solid rgba(251,191,36,0.22); font-size: 14px\"><span>شکایت ارسال · به سارا ارجاع شد<\u002Fspan><span style=\"font-size: 12px; color: #FCD34D\">با خلاصه گفتگو<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; padding: 12px 14px; border-radius: 14px; background: rgba(139,92,246,0.08); border: 1px solid rgba(139,92,246,0.25); font-size: 14px\"><span>گزارش امروز آماده است<\u002Fspan><span style=\"font-size: 12px; color: #C4B5FD\">صبح ساعت ۹<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position: relative; display: flex; flex-direction: column; gap: 12px; font-size: 15px; color: #E4E4E7; line-height: 1.8\">\n<span style=\"display: flex; gap: 10px; align-items: flex-start\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" style=\"color: #34D399; margin-top: 4px\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>هر کامنت و دایرکت در چند ثانیه جواب می‌گیرد، حتی نیمه‌شب.<\u002Fspan>\n<span style=\"display: flex; gap: 10px; align-items: flex-start\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" style=\"color: #34D399; margin-top: 4px\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>سؤال‌های تکراری با اطلاعات به‌روز فروشگاه پاسخ داده می‌شوند.<\u002Fspan>\n<span style=\"display: flex; gap: 10px; align-items: flex-start\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" style=\"color: #34D399; margin-top: 4px\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>سفارش‌ها مرتب ثبت و در داشبورد دیده می‌شوند.<\u002Fspan>\n<span style=\"display: flex; gap: 10px; align-items: flex-start\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" style=\"color: #34D399; margin-top: 4px\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>شما وقتتان را روی محصول و رشد برند می‌گذارید.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- CTA -->\n<section id=\"contact\" style=\"padding: clamp(72px, 9vw, 120px) 0 clamp(56px, 7vw, 88px)\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px)\">\n<div class=\"reveal\" style=\"position: relative; overflow: hidden; border-radius: 36px; background: #101015; border: 1px solid rgba(255,255,255,0.09); padding: clamp(40px, 7vw, 96px) clamp(20px, 5vw, 72px); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 28px\">\n<div class=\"orb cta-glow\" style=\"width: 620px; height: 420px; top: -260px; left: 50%; margin-left: -310px; background: radial-gradient(circle, #DD2A7B, transparent 65%); opacity: {{glow}}\"><\u002Fdiv>\n<div class=\"orb cta-glow\" style=\"width: 520px; height: 380px; bottom: -260px; left: 10%; background: radial-gradient(circle, #8134AF, transparent 65%); opacity: {{glow}}; animation-delay: -3s\"><\u002Fdiv>\n<div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px\">\n<div style=\"padding: 8px 16px; border-radius: 16px 16px 16px 4px; background: rgba(20,20,26,0.9); border: 1px solid rgba(255,255,255,0.12); font-size: 15px; font-weight: 600; color: #F4F4F6\">سلام! من رِیپا هستم.<\u002Fdiv>\n<svg class=\"rb m-wave\" sc-camel-view-box=\"0 0 124 124\" width=\"136\" height=\"136\" aria-hidden=\"true\"><ellipse class=\"rb-shadow\" cx=\"62\" cy=\"117\" rx=\"28\" ry=\"4.5\" fill=\"url(#rp-glow)\"><\u002Fellipse><g class=\"rb-float\"><g class=\"rb-arm-l\"><ellipse cx=\"16\" cy=\"74\" rx=\"8\" ry=\"11.5\" fill=\"url(#rp-body)\"><\u002Fellipse><\u002Fg><g class=\"rb-arm-r\"><ellipse cx=\"108\" cy=\"74\" rx=\"8\" ry=\"11.5\" fill=\"url(#rp-body)\"><\u002Fellipse><\u002Fg><path class=\"rb-shell\" d=\"M62 18C91 18 105 38 105 66C105 94 89 108 62 108C35 108 19 94 19 66C19 38 33 18 62 18Z\" fill=\"url(#rp-body)\"><\u002Fpath><ellipse cx=\"46\" cy=\"31\" rx=\"13\" ry=\"5\" fill=\"#FFFFFF\" opacity=\"0.75\" transform=\"rotate(-18 46 31)\"><\u002Fellipse><rect x=\"31\" y=\"44\" width=\"62\" height=\"38\" rx=\"19\" fill=\"#0D0D13\"><\u002Frect><rect x=\"31\" y=\"44\" width=\"62\" height=\"38\" rx=\"19\" fill=\"url(#rp-visor)\"><\u002Frect><g class=\"rb-look\"><g class=\"e-norm\"><g class=\"rb-blink\"><rect x=\"47\" y=\"55\" width=\"7\" height=\"15\" rx=\"3.5\" fill=\"#FFFFFF\"><\u002Frect><rect x=\"70\" y=\"55\" width=\"7\" height=\"15\" rx=\"3.5\" fill=\"#FFFFFF\"><\u002Frect><\u002Fg><\u002Fg><g class=\"e-happy\"><path class=\"rb-eh\" d=\"M45.5 65Q50.5 57 55.5 65\"><\u002Fpath><path class=\"rb-eh\" d=\"M68.5 65Q73.5 57 78.5 65\"><\u002Fpath><\u002Fg><\u002Fg><ellipse class=\"rb-cheek\" cx=\"40\" cy=\"90\" rx=\"5\" ry=\"2.6\" fill=\"#F472B6\"><\u002Fellipse><ellipse class=\"rb-cheek\" cx=\"84\" cy=\"90\" rx=\"5\" ry=\"2.6\" fill=\"#F472B6\"><\u002Fellipse><path class=\"rb-spark\" d=\"M101 4l2.3 5.4 5.4 2.3-5.4 2.3L101 19.4l-2.3-5.4-5.4-2.3 5.4-2.3z\" fill=\"url(#rp-ig)\"><\u002Fpath><\u002Fg><\u002Fsvg>\n<\u002Fdiv>\n<h2 style=\"position: relative; margin: 0; font-size: clamp(32px, 4.4vw, 60px); line-height: 1.25; font-weight: 900; max-width: 860px\">بگذارید <span class=\"gt\">رِیپا<\u002Fspan> جواب بدهد؛<br>شما روی رشد کسب‌وکارتان تمرکز کنید.<\u002Fh2>\n<p style=\"position: relative; margin: 0; font-size: 18px; color: #A9A9B3; max-width: 560px; line-height: 1.9\">برای راه‌اندازی رِیپا روی پیج اینستاگرام خود، همین حالا با ما تماس بگیرید.<\u002Fp>\n<a href=\"tel:\" aria-label=\"تماس با رِیپا\" style=\"position: relative; display: inline-flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 32px; border-radius: 20px; background: #FFFFFF; color: #0A0A0D; font-size: 20px; font-weight: 800; box-shadow: 0 24px 70px -18px rgba(221,42,123,0.8)\">\n<svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" width=\"22\" height=\"22\"><path d=\"M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z\"><\u002Fpath><\u002Fsvg>\nهمین حالا تماس بگیرید\n<\u002Fa>\n<div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\">\n<span style=\"font-size: 14px; color: #8B8B95\">شماره تماس<\u002Fspan>\n<a href=\"tel:\" style=\"font-size: clamp(28px, 3.4vw, 42px); font-weight: 800; color: #FFFFFF; letter-spacing: 0.04em\" dir=\"ltr\">[شماره تماس]<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"border-top: 1px solid rgba(255,255,255,0.06)\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 28px clamp(16px, 4vw, 40px); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; font-size: 14px; color: #8B8B95\">\n<div style=\"display: flex; align-items: center; gap: 10px\"><svg class=\"rb-mini\" sc-camel-view-box=\"0 0 40 40\" width=\"30\" height=\"30\" aria-hidden=\"true\"><path d=\"M20 4C30 4 35 11 35 21C35 31 29.5 36 20 36C10.5 36 5 31 5 21C5 11 10 4 20 4Z\" fill=\"url(#rp-body)\"><\u002Fpath><rect x=\"10\" y=\"14\" width=\"20\" height=\"13\" rx=\"6.5\" fill=\"#0D0D13\"><\u002Frect><g class=\"rb-blink\"><rect x=\"15\" y=\"17.3\" width=\"2.6\" height=\"6.2\" rx=\"1.3\" fill=\"#FFFFFF\"><\u002Frect><rect x=\"22.4\" y=\"17.3\" width=\"2.6\" height=\"6.2\" rx=\"1.3\" fill=\"#FFFFFF\"><\u002Frect><\u002Fg><\u002Fsvg><span style=\"font-weight: 800; color: #E4E4E7\">رِیپا<\u002Fspan><span class=\"en\" style=\"font-size: 10px\">REIPA<\u002Fspan><\u002Fdiv>\n<span>دستیار هوش مصنوعی برای کسب‌وکارهای اینستاگرامی · ۱۴۰۵<\u002Fspan>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;animate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;Motion&quot;},&quot;glow&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.55,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;section&quot;:&quot;Look&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:7300}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this.start();\n  }\n  componentDidUpdate(prev) {\n    if ((prev.animate ?? true) !== (this.props.animate ?? true)) { this.stop(); this.start(); }\n  }\n  componentWillUnmount() {\n    this.stop();\n  }\n  start() {\n    if ((this.props.animate ?? true) === false) return;\n    this.timer = setInterval(() => {\n      this.setState((s) => ({ t: ((s && s.t) || 0) + 1 }));\n    }, 1300);\n  }\n  stop() {\n    if (this.timer) { clearInterval(this.timer); this.timer = null; }\n  }\n  renderVals() {\n    const anim = this.props.animate ?? true;\n    const st = this.state || {};\n    const t = anim ? (st.t || 0) : 0;\n    const fa = (n) => Number(n).toLocaleString('fa-IR');\n    const glow = this.props.glow ?? 0.55;\n\n    // Hero chat sequence\n    const hs = anim ? t % 13 : 10;\n    const h = {\n      c1: hs >= 1, t1: hs === 2, r1: hs >= 3, c2: hs >= 5, t2: hs === 6,\n      r2: hs >= 7, intent: hs >= 5, order: hs >= 8, toast: hs >= 9\n    };\n    const aj = hs < 1 ? 0 : hs < 5 ? 1 : hs < 8 ? 2 : hs < 10 ? 3 : 4;\n    const jl = ['کامنت', 'گفتگو', 'نیت خرید', 'خرید', 'گزارش'];\n    const journey = jl.map((label, i) => ({\n      label, arrow: i < jl.length - 1,\n      cls: i === aj ? 'jchip on' : (i < aj ? 'jchip done' : 'jchip')\n    }));\n\n    // Flow stages\n    const stage = anim ? Math.floor(t / 2) % 5 : 4;\n    const sc = (i) => (i === stage ? 'stg on' : (i < stage ? 'stg done' : 'stg'));\n\n    // Intent pipeline\n    const ip = anim ? Math.floor(t / 2) % 6 : 5;\n    const nc = (i) => (ip >= i ? 'node on' : 'node');\n\n    // Feature tabs\n    const tab = st.tab ?? 0;\n    const tdata = [\n      { t: 'پشتیبانی هوشمند', d: 'پاسخ فوری به سؤال‌های تکراری، شبانه‌روز' },\n      { t: 'فروش و ثبت سفارش', d: 'از «موجوده؟» تا لینک پرداخت' },\n      { t: 'دانش محصول', d: 'قیمت، موجودی و سایز همیشه به‌روز' },\n      { t: 'مدیریت محتوا', d: 'برنامه انتشار و کپشن پیشنهادی' },\n      { t: 'تحلیل و گزارش', d: 'گزارش روشن از گفتگوها و فروش' },\n      { t: 'تحویل به انسان', d: 'ارجاع به‌موقع گفتگوهای حساس' }\n    ];\n    const tabs = tdata.map((x, i) => ({\n      ...x, n: '0' + (i + 1), sel: i === tab ? 'true' : 'false',\n      cls: i === tab ? 'tab on' : 'tab',\n      pick: () => this.setState({ tab: i })\n    }));\n\n    // Dashboard\n    const k = {\n      conv: fa(1284 + t * 3),\n      intent: fa(312 + Math.floor(t / 2)),\n      orders: fa(86 + Math.floor(t / 4))\n    };\n    const tagStyles = {\n      buy: 'background: rgba(236,72,153,0.14); color: #F9A8D4',\n      ask: 'background: rgba(139,92,246,0.14); color: #C4B5FD',\n      track: 'background: rgba(56,189,248,0.12); color: #7DD3FC',\n      human: 'background: rgba(251,191,36,0.14); color: #FCD34D'\n    };\n    const convs = [\n      { i: 'م', n: 'مریم احمدی', m: 'می‌خوام سفارش بدم، سایز M', tag: 'قصد خرید', k: 'buy', t: 'الان' },\n      { i: 'ر', n: 'رضا کریمی', m: 'ارسال به مشهد چند روزه؟', tag: 'سؤال ارسال', k: 'ask', t: '۲ دقیقه' },\n      { i: 'ن', n: 'نازنین', m: 'کیف مشکی تا پنجشنبه می‌رسه؟', tag: 'قصد خرید', k: 'buy', t: '۵ دقیقه' },\n      { i: 'ه', n: 'هانیه', m: 'سفارشم کی ارسال میشه؟', tag: 'پیگیری سفارش', k: 'track', t: '۹ دقیقه' },\n      { i: 'ع', n: 'علی', m: 'بسته آسیب‌دیده رسیده', tag: 'ارجاع به تیم', k: 'human', t: '۱۴ دقیقه' }\n    ].map((c) => ({ ...c, tagStyle: tagStyles[c.k] }));\n    const faqs = [\n      { q: 'قیمت چنده؟', v: 38 }, { q: 'موجوده؟', v: 24 }, { q: 'ارسال چند روزه؟', v: 17 },\n      { q: 'راهنمای سایز', v: 12 }, { q: 'تخفیف دارید؟', v: 9 }\n    ].map((f) => ({ q: f.q, p: fa(f.v) + '٪', w: Math.round(f.v / 38 * 100) + '%' }));\n    const wd = [['ش', 52, 18], ['ی', 64, 22], ['د', 58, 20], ['س', 72, 28], ['چ', 80, 31], ['پ', 92, 38], ['ج', 70, 26]];\n    const wobble = anim ? (t % 4) : 0;\n    const week = wd.map((d, i) => ({\n      l: d[0],\n      a: Math.min(100, d[1] + ((i + wobble) % 3) * 2) + '%',\n      b: Math.min(100, d[2] + ((i + wobble) % 2) * 3) + '%'\n    }));\n\n    // Content recommendation button\n    const applied = !!st.applied;\n\n    // REIPA character moods\n    const hm = ['readr', 'think', 'type', 'happy', 'readr', 'aha', 'type', 'readr', 'think', 'happy', 'happy', 'wave', 'idle'];\n    const hsay = ['', 'بررسی موجودی محصول…', 'در حال نوشتن…', 'پاسخ داده شد', '', 'نیت خرید شناسایی شد!', 'در حال نوشتن…', '', 'ثبت سفارش…', 'سفارش ثبت شد!', 'سفارش ثبت شد!', '', ''];\n    const heroMood = hm[hs] || 'idle';\n    const heroSay = { show: !!hsay[hs], text: hsay[hs] || '' };\n    const guideMood = ['aha', 'think', 'type', 'type', 'happy'][stage];\n    const guideRight = 'calc(' + (10 + stage * 20) + '% - 38px)';\n    const intentMood = ['readr', 'aha', 'think', 'type', 'happy', 'happy'][ip];\n    const intentLine = [\n      'یک پیام تازه رسید…',\n      'نیت شناسایی شد: سؤال موجودی، آماده خرید!',\n      'دارم موجودی و زمان ارسال را چک می‌کنم…',\n      'در حال نوشتن پاسخ…',\n      'پاسخ ارسال شد. مشتری یک قدم تا خرید فاصله دارد.',\n      'پاسخ ارسال شد. مشتری یک قدم تا خرید فاصله دارد.'\n    ][ip];\n    const dashHappy = anim && t > 0 && t % 4 === 0;\n    const dashMood = dashHappy ? 'happy' : 'analytics';\n\n    return {\n      rootCls: anim ? '' : 'still',\n      heroMood, heroSay, guideMood, guideRight, intentMood, intentLine, dashHappy, dashMood,\n      glow: glow, glowSoft: Math.round(glow * 0.6 * 100) / 100,\n      h, journey,\n      s0: sc(0), s1: sc(1), s2: sc(2), s3: sc(3), s4: sc(4),\n      flowFill: ((stage + 1) * 20) + '%',\n      n0: nc(0), n1: nc(1), n2: nc(2), n3: nc(3),\n      tabs,\n      tab0: tab === 0, tab1: tab === 1, tab2: tab === 2, tab3: tab === 3, tab4: tab === 4, tab5: tab === 5,\n      k, convs, faqs, week,\n      applyLabel: applied ? 'در تقویم محتوا ثبت شد ✓' : 'اعمال پیشنهادها در برنامه انتشار',\n      applyStyle: applied ? 'background: rgba(52,211,153,0.16); color: #6EE7B7' : 'background: #FFFFFF; color: #0A0A0D',\n      applyRec: () => this.setState({ applied: !applied })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
